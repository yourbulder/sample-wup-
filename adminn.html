<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Admin Dashboard</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0b0b">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--surface:#121212;--surface-2:#181818;--text:#f5f2eb;--muted:#aaa;--accent:#d7a85c;--border:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--text);font:400 16px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit}
label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
.btn{min-height:48px;padding:0 22px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);font-weight:600}.btn.pri{background:var(--accent);color:#111;border-color:var(--accent)}.btn.del{color:#ff7b72}
#login{min-height:100dvh;display:grid;place-items:center;padding:20px}#login form{width:min(380px,100%);background:var(--surface);padding:28px;border-radius:20px;border:1px solid var(--border)}
#app{display:none;min-height:100dvh}#app.on{display:block}
aside{position:fixed;inset:0 auto 0 0;width:240px;background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;z-index:30;transition:transform .3s;transform:translateX(-100%)}aside.open{transform:none}
aside h2{padding:0 12px 16px;font-size:1.1rem}aside button{display:block;width:100%;text-align:left;min-height:48px;padding:0 14px;background:none;border:0;border-radius:10px;color:var(--muted)}aside button.on{background:var(--surface-2);color:var(--accent)}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}.top button{width:48px;height:48px;font-size:1.4rem;background:none;border:0}
main{padding:20px 16px 80px;max-width:900px}main h1{font-size:1.6rem;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px}.stat b{font-size:2rem;display:block}.stat span{color:var(--muted);font-size:.85rem}
.item{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px;flex-wrap:wrap}.item img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2)}.item .t{flex:1;min-width:140px}.item small{color:var(--muted)}.item .acts{display:flex;gap:8px;width:100%}.item .acts button{flex:1}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:20px}.two{display:grid;gap:0 12px}
#prev{width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:#111;padding:12px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none;z-index:99;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){aside{transform:none}.top button{display:none}#app.on{padding-left:240px}.stats{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1fr 1fr}.item .acts{width:auto}}
</style></head><body>
<div id="login"><form id="lf"><h2 style="margin-bottom:6px">Admin login</h2><p style="color:var(--muted);font-size:.9rem">Demo login. Default password: admin123</p><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><button class="btn pri" style="width:100%;margin-top:16px">Log in</button></form></div>
<div id="app"><aside id="side"><h2 id="bn">Dashboard</h2></aside><div class="top"><button id="burger" aria-label="Open navigation">☰</button><strong id="ttl">Dashboard</strong><a href="index.html" style="margin-left:auto;color:var(--accent)">View site</a></div><main id="main"></main></div><div id="toast" role="status"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA5TuR7N5A1DegDeQAOWpZCdLYq_3Rld2A",
  authDomain: "qr-code-base.firebaseapp.com",
  databaseURL: "https://qr-code-base-default-rtdb.firebaseio.com",
  projectId: "qr-code-base",
  storageBucket: "qr-code-base.firebasestorage.app",
  messagingSenderId: "1084109573340",
  appId: "1:1084109573340:web:7b439d17b71c86756bf819",
  measurementId: "G-NWDT0S8EVS"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const U=(id,w=800)=>`https://images.unsplash.com/${id}?w=${w}&q=80`;
const D={settings:{name:'Spice Route Kitchen',phone:'9811353658',whatsapp:'9811353658',address:'Shop 12, Main Market, Faridabad, Haryana',hours:'Mon–Sun, 11:00 AM – 11:00 PM',heroTitle:'Food that makes you stop.',heroSub:'Authentic, fresh and made with care. Order in under a minute on WhatsApp.',accent:'#d7a85c',story:'We cook slowly, season carefully and serve every plate the way we would at home. Small kitchen, fresh ingredients, no shortcuts.'},
menu:[{id:1,name:'Butter Chicken',desc:'Slow cooked tomato gravy, butter and aromatic spices.',price:299,cat:'Main Course',img:U('photo-1603894584373-5ac82b2ae398'),veg:false,spice:2,avail:true},
{id:2,name:'Chicken Biryani',desc:'Long grain basmati layered with marinated chicken, dum cooked.',price:250,cat:'Biryani',img:U('photo-1563379091339-03b21ab4a4f8'),veg:false,spice:3,avail:true},
{id:3,name:'Paneer Tikka',desc:'Charred cottage cheese with mint chutney.',price:220,cat:'Starters',img:U('photo-1567188040759-fb8a883dc6d8'),veg:true,spice:2,avail:true},
{id:4,name:'Garlic Naan',desc:'Tandoor baked, brushed with garlic butter.',price:80,cat:'Main Course',img:U('photo-1626074353765-517a681e40be'),veg:true,spice:0,avail:true},
{id:5,name:'Masala Chai',desc:'Ginger, cardamom and strong tea, served hot.',price:40,cat:'Drinks',img:U('photo-1561336313-0bd5e0b27ec8'),veg:true,spice:0,avail:true},
{id:6,name:'Gulab Jamun',desc:'Warm milk dumplings in rose syrup.',price:90,cat:'Desserts',img:U('photo-1666190092159-3171cf0fbb12'),veg:true,spice:0,avail:false}],
reviews:[{id:1,name:'Rahul',stars:5,text:'Absolutely delicious. The biryani was amazing.'},{id:2,name:'Priya',stars:5,text:'Fresh, hot and on time. Ordering on WhatsApp was so easy.'}],
gallery:[U('photo-1631452180519-c014fe946bc7',700),U('photo-1585937421612-70a008356fbe',700),U('photo-1589302168068-964664d93dc0',700),U('photo-1596797038530-2c107229654b',700)],
offers:[{id:1,title:'20% off',text:"Today's special on selected items. Limited time."}]};

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state = { settings: D.settings, menu: D.menu, reviews: D.reviews, gallery: D.gallery, offers: D.offers };
const save = (k) => set(ref(db, 'foodApp/' + k), state[k]);

async function fetchDb() {
  const snap = await get(ref(db, 'foodApp'));
  if (snap.exists()) {
    const data = snap.val();
    if(data.settings) state.settings = { ...D.settings, ...data.settings };
    if(data.menu) state.menu = data.menu || [];
    if(data.reviews) state.reviews = data.reviews || [];
    if(data.gallery) state.gallery = data.gallery || [];
    if(data.offers) state.offers = data.offers || [];
  }
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2400)}
const okUrl=u=>{try{return /^https?:$/.test(new URL(u).protocol)}catch(e){return false}};
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id||0),0)+1;
let tab='Dashboard',editing=null;
const TABS=['Dashboard','Menu','Offers','Gallery','Reviews','Settings','Backup'];

function start(){$('#login').style.display='none';$('#app').classList.add('on');document.documentElement.style.setProperty('--accent',state.settings.accent);
$('#side').innerHTML='<h2>'+esc(state.settings.name)+'</h2>'+TABS.map(t=>`<button data-t="${t}">${t}</button>`).join('')+'<button data-t="out">Log out</button>';render()}

$('#side').onclick=e=>{const t=e.target.dataset.t;if(!t)return;$('#side').classList.remove('open');if(t==='out'){sessionStorage.clear();location.reload()}else{tab=t;editing=null;render()}};
$('#burger').onclick=()=>$('#side').classList.toggle('open');
const fld=(id,label,v,type='text')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(v)}"></div>`;

function render(){document.querySelectorAll('#side [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));$('#ttl').textContent=tab;const m=$('#main');
if(tab==='Dashboard'){const s=state.menu;m.innerHTML=`<h1>Overview</h1><div class="stats"><div class="stat"><b>${s.length}</b><span>Dishes</span></div><div class="stat"><b>${s.filter(x=>!x.avail).length}</b><span>Sold out</span></div><div class="stat"><b>${state.offers.length}</b><span>Offers</span></div><div class="stat"><b>${state.reviews.length}</b><span>Reviews</span></div></div><p style="color:var(--muted);margin-top:20px;font-size:.9rem">Firebase Realtime Database Connected.</p>`}
else if(tab==='Menu')menuView(m);else if(tab==='Settings'){const s=state.settings;m.innerHTML=`<h1>Business settings</h1><div class="panel two">${[['name','Business name'],['phone','Phone'],['whatsapp','WhatsApp (orders always go to 919811353658)'],['address','Address'],['hours','Opening hours'],['heroTitle','Hero heading'],['heroSub','Hero subtitle'],['story','Story']].map(([k,l])=>fld('s_'+k,l,s[k])).join('')}<div><label for="s_accent">Accent color</label><input id="s_accent" type="color" value="${esc(s.accent)}"></div></div><button class="btn pri" id="ss">Save settings</button>`;
$('#ss').onclick=()=>{const p=$('#s_phone').value.replace(/\D/g,'');if(p.length!==10)return toast('Phone must be 10 digits');['name','phone','whatsapp','address','hours','heroTitle','heroSub','story','accent'].forEach(k=>s[k]=$('#s_'+k).value.trim());save('settings');document.documentElement.style.setProperty('--accent',s.accent);toast('Settings updated')}}
else if(tab==='Backup'){m.innerHTML=`<h1>Backup</h1><div class="panel"><button class="btn pri" id="ex">Export JSON</button><label for="im">Import JSON file</label><input id="im" type="file" accept="application/json"></div>`;
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='food-site-backup.json';a.click()};
$('#im').onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);Object.keys(D).forEach(k=>{if(d[k]){state[k]=d[k];save(k)}});toast('Data imported');render()}catch(x){toast('Invalid JSON file')}};r.readAsText(e.target.files[0])}}
else listView(m,tab.toLowerCase())}

function listView(m,k){const cfg={offers:[['title','Title'],['text','Description']],reviews:[['name','Customer name'],['stars','Stars (1-5)'],['text','Review']],gallery:[['url','Image URL']]}[k];const arr=state[k];
m.innerHTML=`<h1>${tab}</h1><div class="panel two">${cfg.map(([f,l])=>fld('f_'+f,l,'')).join('')}<div style="grid-column:1/-1"><button class="btn pri" id="add">Add</button></div></div>`+(arr.length?arr.map((x,i)=>`<div class="item">${k==='gallery'?`<img alt="" src="${esc(x)}">`:''}<div class="t">${k==='gallery'?`<small>${esc(x.slice(0,50))}</small>`:`<b>${esc(x.title\vert{}\vert{}x.name)}</b><br><small>${esc(x.text)}</small>`}</div><button class="btn del" data-d="${i}">Delete</button></div>`).join(''):'<p style="color:var(--muted)">Nothing here yet.</p>');
$('#add').onclick=()=>{const v={};cfg.forEach(([f])=>v[f]=$('#f_'+f).value.trim());
if(k==='gallery'){if(!okUrl(v.url))return toast('Invalid image URL');arr.push(v.url)}else{if(!(v.title||v.name)||!v.text)return toast('Please fill all fields');if(k==='reviews')v.stars=Math.min(5,Math.max(1,+v.stars||5));v.id=nid(arr);arr.push(v)}save(k);toast('Saved successfully');render()};
m.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(confirm('Delete this item?')){arr.splice(+b.dataset.d,1);save(k);toast('Deleted');render()}})}

function menuView(m){const e=editing;if(e){const x=e==='new'?{name:'',desc:'',price:'',cat:'',img:'',veg:true,spice:0,avail:true}:state.menu.find(i=>i.id===e);
m.innerHTML=`<h1>${e==='new'?'Add dish':'Edit dish'}</h1><div class="panel two">${fld('m_name','Food name',x.name)}${fld('m_price','Price (₹)',x.price,'number')}${fld('m_cat','Category',x.cat)}${fld('m_img','Image URL',x.img,'url')}<div style="grid-column:1/-1"><label for="m_desc">Description</label><textarea id="m_desc" rows="3">${esc(x.desc)}</textarea><img id="prev" alt="Preview"></div><div><label for="m_veg">Type</label><select id="m_veg"><option value="1" ${x.veg?'selected':''}>Veg</option><option value="0" ${x.veg?'':'selected'}>Non-veg</option></select></div><div><label for="m_spice">Spice level</label><select id="m_spice">${[0,1,2,3].map(n=>`<option ${x.spice==n?'selected':''}>${n}</option>`).join('')}</select></div><div><label for="m_av">Availability</label><select id="m_av"><option value="1" ${x.avail?'selected':''}>Available</option><option value="0" ${x.avail?'':'selected'}>Sold out</option></select></div></div><button class="btn pri" id="sv">Save food</button> <button class="btn" id="cn">Cancel</button>`;
const pv=()=>{const u=$('#m_img').value,p=$('#prev');if(okUrl(u)){p.src=u;p.style.display='block';p.onerror=()=>{p.style.display='none';toast('Image could not load')}}else p.style.display='none'};$('#m_img').oninput=pv;pv();
$('#cn').onclick=()=>{editing=null;render()};
$('#sv').onclick=()=>{const v={name:$('#m_name').value.trim(),price:+$('#m_price').value,cat:$('#m_cat').value.trim()\vert{}\vert{}'Other',img:$('#m_img').value.trim(),desc:$('#m_desc').value.trim(),veg:$('#m_veg').value==='1',spice:+$('#m_spice').value,avail:$('#m_av').value==='1'};
if(!v.name)return toast('Please enter a food name');if(!(v.price>0))return toast('Enter a valid price');if(v.img&&!okUrl(v.img))return toast('Invalid image URL');
if(e==='new')state.menu.push({id:nid(state.menu),...v});else Object.assign(x,v);save('menu');editing=null;toast('Food saved successfully');render()}}
else{m.innerHTML=`<h1>Menu</h1><button class="btn pri" id="nw" style="margin-bottom:16px">Add dish</button>`+(state.menu.length?state.menu.map(x=>`<div class="item"><img alt="" src="${esc(x.img)}" onerror="this.style.opacity=.2"><div class="t"><b>${esc(x.name)}</b><br><small>${esc(x.cat)} · ₹${x.price}${x.avail?'':' · Sold out'}</small></div><div class="acts"><button class="btn" data-e="${x.id}">Edit</button><button class="btn del" data-x="${x.id}">Delete</button></div></div>`).join(''):'<p style="color:var(--muted)">No dishes yet. Add your first dish.</p>');
$('#nw').onclick=()=>{editing='new';render()};m.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{editing=+b.dataset.e;render()});
m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{if(confirm('Delete this dish?')){state.menu=state.menu.filter(i=>i.id!==+b.dataset.x);save('menu');toast('Food deleted');render()}})}}

$('#lf').onsubmit = async e => {
  e.preventDefault();
  if($('#pw').value==='admin123') {
    sessionStorage.setItem('adm','1');
    await fetchDb();
    start();
  } else toast('Wrong password');
};

if (sessionStorage.getItem('adm')) {
  fetchDb().then(start);
}
</script></body></html>
