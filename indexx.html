<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order Fresh Indian Food Online</title>
<meta name="description" content="Fresh, authentic Indian food made with care. Browse the menu and order on WhatsApp.">
<meta name="theme-color" content="#0b0b0b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--surface:#121212;--surface-2:#181818;--text:#f5f2eb;--muted:#aaa;--accent:#d7a85c;--border:rgba(255,255,255,.1);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,sans-serif;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.1}
img{display:block;max-width:100%}button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{width:min(1400px,100%);margin:auto;padding:0 max(20px,env(safe-area-inset-left))}
section{padding:clamp(56px,9vw,120px) 0}
.sec-h{font-size:clamp(2rem,5.5vw,3.6rem);margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 26px;border-radius:99px;border:1px solid var(--border);background:transparent;font-weight:600;transition:transform .2s,background .2s}
.btn:active{transform:scale(.98)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#111}.btn[disabled]{opacity:.4;pointer-events:none}
header{position:fixed;inset:0 0 auto;z-index:50;padding-top:env(safe-area-inset-top);transition:background .3s}
header.solid{background:rgba(11,11,11,.92);backdrop-filter:blur(10px)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700}
.links{display:none;gap:28px;align-items:center}.links a{color:var(--muted);transition:color .2s}.links a:hover{color:var(--text)}
.burger{width:48px;height:48px;background:none;border:0;font-size:1.6rem}
#mnav{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:24px 32px;gap:6px;transform:translateY(-100%);transition:transform .45s cubic-bezier(.7,0,.2,1);visibility:hidden}
#mnav.open{transform:none;visibility:visible}#mnav a{font:700 2rem 'Playfair Display',serif;padding:8px 0}
#mclose{position:absolute;top:calc(12px + env(safe-area-inset-top));right:16px;background:none;border:0;font-size:2rem;width:48px;height:48px}
.hero{position:relative;min-height:78svh;display:flex;align-items:flex-end;padding:0 0 56px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zoom 14s ease-out forwards}
.hero:after{content:"absolute";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.6))}
.hero .wrap{position:relative;z-index:1}.hero h1{font-size:clamp(2.6rem,9vw,6.5rem);max-width:12ch;animation:up .9s .1s both}
.hero p{max-width:46ch;color:#ddd;margin:18px 0 26px;animation:up .9s .25s both}.ctas{display:flex;gap:12px;flex-wrap:wrap;animation:up .9s .4s both}
@keyframes zoom{from{transform:scale(1.03)}to{transform:scale(1.1)}}@keyframes up{from{opacity:0;transform:translateY(24px)}}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 28px;padding:0 20px}.cats::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--border);background:none;transition:.2s}.chip.on{background:var(--accent);color:#111;border-color:var(--accent);font-weight:600}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{background:var(--surface);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--border)}
.card .im{aspect-ratio:4/3;overflow:hidden;cursor:pointer;position:relative;background:var(--surface-2)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .6s}.card:hover img{transform:scale(1.06)}
.card .b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border:1.5px solid #2e9e4f;display:inline-grid;place-items:center;border-radius:3px}.dot:after{content:"";width:6px;height:6px;border-radius:50%;background:#2e9e4f}.dot.nv{border-color:#c0392b}.dot.nv:after{background:#c0392b}
.card h3{font-size:1.3rem}.card p{color:var(--muted);font-size:.92rem;flex:1}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}.price{font-size:1.25rem;font-weight:600}
.sold{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;font-weight:600;letter-spacing:.1em}
.empty{color:var(--muted);padding:40px 0}
.offer{background:linear-gradient(120deg,#1a1408,var(--surface-2));border:1px solid var(--border);border-radius:24px;padding:clamp(28px,6vw,72px)}
.offer h2{font-size:clamp(2.4rem,8vw,5.5rem);color:var(--accent)}
.story{display:grid;gap:32px}.story img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:20px}.story p{color:var(--muted);max-width:52ch;font-size:1.05rem}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;transition:transform .5s}.gal img:hover{transform:scale(1.03)}
.revs{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -20px;padding:0 20px}
.rev{flex:none;width:min(84%,360px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px}.rev .st{color:var(--accent)}.rev p{margin:10px 0 14px;font-family:'Playfair Display',serif;font-size:1.15rem}
.contact{display:grid;gap:24px}.contact dt{color:var(--muted);font-size:.85rem}.contact dd{margin-bottom:14px;font-size:1.1rem}
footer{border-top:1px solid var(--border);padding:32px 0 calc(32px + 70px);color:var(--muted);font-size:.9rem}
